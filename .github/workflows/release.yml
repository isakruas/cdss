name: Release

on:
  push:
    tags: ['v*']

jobs:
  # ── 1. Build ─────────────────────────────────────────────────────────────
  build:
    name: Build — linux-x86_64
    runs-on: ubuntu-latest
    container: debian:bookworm-slim

    steps:
      - name: Install git and network tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates curl

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends gfortran libfftw3-dev

      - name: Install FPM
        run: |
          curl -fsSL \
            "https://github.com/fortran-lang/fpm/releases/download/v0.10.1/fpm-0.10.1-linux-x86_64" \
            -o /usr/local/bin/fpm
          chmod +x /usr/local/bin/fpm

      - name: Build
        env:
          FPM_FFLAGS:  "-Ofast -fopenmp -march=x86-64 -flto -fno-protect-parens -I/usr/include"
          FPM_LDFLAGS: "-fopenmp -flto -lfftw3 -lm"
        run: fpm build --profile release

      - name: Collect binary
        run: |
          BIN=$(find build -path "*/app/cdss" -type f | sort | tail -1)
          cp "$BIN" cdss-linux-x86_64
          chmod +x cdss-linux-x86_64
          ls -lh cdss-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: cdss-linux-x86_64
          path: cdss-linux-x86_64

  # ── 2. Monte Carlo campaign + PDF report ─────────────────────────────────
  campaign:
    name: Monte Carlo Campaign
    needs: build
    runs-on: ubuntu-latest
    container: debian:bookworm-slim

    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            git ca-certificates make python3 python3-pip python3-venv \
            libgfortran5 libfftw3-3 libgomp1

      - uses: actions/checkout@v4

      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: cdss-linux-x86_64
          path: bin/

      - name: Make binary executable
        run: chmod +x bin/cdss-linux-x86_64

      # release = full scientific grid; SKIP_BUILD=1 because fpm is not installed here.
      - name: Run Monte Carlo publication validation and generate PDF report
        env:
          OMP_NUM_THREADS: "1"
          MPLBACKEND: Agg
        run: |
          make -C research release \
            SKIP_BUILD=1 \
            BINARY="$(pwd)/bin/cdss-linux-x86_64" \
            OUT_DIR="$(pwd)/campaign" \
            REPORT_VERSION="${{ github.ref_name }}" \
            REPORT_OUT="$(pwd)/cdss-${{ github.ref_name }}-release-report.pdf" \
            REPORT_TITLE="CDSS Release Validation Report" \
            WORKERS=4 \
            OMP_THREADS=1 \
            SEED_BASE=6703739 \
            TIMEOUT_S=300

      - uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: cdss-${{ github.ref_name }}-release-report.pdf

  # ── 3. Assemble dist/ + checksums + optional GPG signature ───────────────
  package:
    name: Package Distribution
    needs: [build, campaign]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Assemble dist/
        run: |
          mkdir -p dist
          V="${{ github.ref_name }}"
          cp artifacts/cdss-linux-x86_64/cdss-linux-x86_64 "dist/cdss-${V}-linux-x86_64"
          chmod 755 "dist/cdss-${V}-linux-x86_64"
          cp "artifacts/validation-report/cdss-${V}-release-report.pdf" dist/

      - name: Generate SHA-256 and SHA-512 checksums
        working-directory: dist
        run: |
          sha256sum cdss-* > SHA256SUMS
          sha512sum cdss-* > SHA512SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Sign SHA256SUMS and export public key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE:  ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --armor --export > dist/release-key.asc
          cd dist
          echo "$GPG_PASSPHRASE" | gpg \
            --batch --yes --passphrase-fd 0 \
            --armor --detach-sign \
            --output SHA256SUMS.asc SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS
          echo "GPG signature: OK"

      - name: List distribution contents
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── 4. Publish GitHub Release ─────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ## CDSS ${{ github.ref_name }}

            CHIRP-DSSS-Polar digital modem with soft-decision reception and iterative refinement.
            Compiled from Debian Bookworm (gfortran, libfftw3).

            ### Binary

            | File | Architecture |
            |------|--------------|
            | `cdss-${{ github.ref_name }}-linux-x86_64` | Linux x86-64 |

            ### Validation report

            `cdss-${{ github.ref_name }}-release-report.pdf` — validation report
            BER/FER/CRC curves across all channel profiles (Aligned AWGN,
            Sync AWGN, CFO+Drift, Tone Interference, Clock Skew, Mixed Impairments).

            ### Integrity verification

            ```sh
            # Import the release public key (included in this release)
            gpg --import release-key.asc

            # Verify GPG signature
            gpg --verify SHA256SUMS.asc SHA256SUMS

            # Verify file checksums
            sha256sum --check SHA256SUMS
            ```
