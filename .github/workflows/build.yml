name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build — linux-x86_64
    runs-on: ubuntu-latest
    container: debian:bookworm-slim

    steps:
      - name: Install git and network tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            git ca-certificates curl

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            gfortran libfftw3-dev make

      - name: Install FPM
        run: |
          curl -fsSL \
            "https://github.com/fortran-lang/fpm/releases/download/v0.10.1/fpm-0.10.1-linux-x86_64" \
            -o /usr/local/bin/fpm
          chmod +x /usr/local/bin/fpm
          fpm --version

      - name: Build
        env:
          FPM_FFLAGS:  "-Ofast -fopenmp -march=x86-64 -flto -fno-protect-parens -I/usr/include"
          FPM_LDFLAGS: "-fopenmp -flto -lfftw3 -lm"
        run: fpm build --profile release

      - name: Test
        env:
          FPM_FFLAGS:      "-O2 -I/usr/include"
          FPM_LDFLAGS:     "-lfftw3 -lm"
          OMP_NUM_THREADS: "1"
        run: fpm test --profile debug

      - name: Collect binary
        run: |
          BIN=$(find build -path "*/app/cdss" -type f | sort | tail -1)
          cp "$BIN" cdss-linux-x86_64
          chmod +x cdss-linux-x86_64
          ls -lh cdss-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: cdss-linux-x86_64
          path: cdss-linux-x86_64
          retention-days: 7
